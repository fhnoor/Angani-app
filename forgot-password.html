<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Forgot Password — Angani Kwetu</title>
    <link rel="stylesheet" href="https://fhnoor.github.io/Angani-app/css/style.css">
    <link rel="stylesheet" href="https://fhnoor.github.io/Angani-app/css/auth.css">
    <link rel="icon" type="image/x-icon" href="https://fhnoor.github.io/Angani-app/favicon.ico">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <header class="auth-header">
                <h1>Reset password</h1>
                <p class="muted">Enter your email address and we'll send you instructions to reset your password.</p>
            </header>

            <form id="forgot-password-form" class="auth-form" novalidate>
                <label class="field">
                    <span class="label-text">Email</span>
                    <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                </label>

                <button type="submit" class="btn primary">Send reset instructions</button>

                <div class="hr"><span>or</span></div>

                <p class="small muted">Remember your password? <a href="signin.html">Sign in</a></p>
            </form>

            <footer class="auth-foot">
                <a href="landing.html">← Back to Home</a>
            </footer>
        </section>
    </main>
    <script src="https://fhnoor.github.io/Angani-app/js/auth.js"></script>
</body>
</html>
