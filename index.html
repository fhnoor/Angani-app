<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angani Kwetu - Welcome</title>
    <link rel="icon" type="image/x-icon" href="https://fhnoor.github.io/Angani-app/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.86);
            margin-bottom: 20px;
            font-size: 15px;
        }
        .weather-info {
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        .weather-info.active {
            display: block;
        }
        .city-name, h2 {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 10px;
            text-align: center;
        }
        .temperature {
            font-size: 56px;
            font-weight: 700;
            color: #ffd966;
            margin: 16px 0;
            text-shadow: 0 3px 18px rgba(0,0,0,0.6);
        }
        .description {
            font-size: 20px;
            color: rgba(255,255,255,0.9);
            text-transform: capitalize;
            margin-bottom: 20px;
        }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }
        .loading.hidden {
            display: none;
        }
        .loading p {
            color: rgba(255,255,255,0.86);
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #ffd966;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            display: none;
            background: rgba(255,77,87,0.2);
            color: #ffb3ba;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid rgba(255,77,87,0.3);
        }
        .error-message.active {
            display: block;
        }
        .continue-btn {
            background: linear-gradient(135deg,#6c7bf3,#5b5fd6);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(91,95,214,0.28);
            transition: transform 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
            display: none;
            margin-top: 20px;
        }
        .continue-btn.active {
            display: inline-block;
        }
        .continue-btn:hover {
            transform: translateY(-2px);
            opacity: 0.98;
        }
        .continue-btn:active {
            transform: translateY(0);
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Angani Kwetu</h1>
        <p class="subtitle">Your Local Weather</p>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Getting your location...</p>
        </div>

        <div class="weather-info" id="weatherInfo">
            <h2 id="cityName"></h2>
            <div class="temperature" id="temperature"></div>
            <div class="description" id="description"></div>
            <div id="condition-anim" class="condition-anim" aria-hidden="true"></div>
        </div>

        <div class="error-message" id="errorMessage">
            Unable to get your location. Please enable location services to see your local weather.
        </div>

        <button class="continue-btn" id="continueBtn">Search More Cities</button>
    </div>

    <footer class="footer">
        <p>Created by Noor</p><br>
        <p>&copy; 2025 Angani Kwetu. All rights reserved.</p>
    </footer>

    <script src="js/index.js"></script>
</body>
</html>
