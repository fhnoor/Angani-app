<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign Up — Angani Kwetu</title>
    <link rel="stylesheet" href="https://fhnoor.github.io/Angani-app/css/style.css">
    <link rel="stylesheet" href="https://fhnoor.github.io/Angani-app/css/auth.css">
    <link rel="icon" type="image/x-icon" href="https://fhnoor.github.io/Angani-app/favicon.ico">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <header class="auth-header">
                <h1>Create account</h1>
                <p class="muted">Join Angani to get local weather updates and more.</p>
            </header>

            <form id="signup-form" class="auth-form" action="/signup" method="POST" novalidate>
                <label class="field">
                    <span class="label-text">Full name</span>
                    <input type="text" name="name" placeholder="Jane Doe" autocomplete="name">
                </label>

                <label class="field">
                    <span class="label-text">Email</span>
                    <input type="email" name="email" placeholder="you@example.com" autocomplete="email">
                </label>

                <label class="field">
                    <span class="label-text">Password</span>
                    <div class="password-field">
                        <input type="password" name="password" class="password-input" placeholder="Create a password" autocomplete="new-password">
                        <button type="button" class="toggle-password-btn" aria-label="Show/hide password">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </label>

                <label class="field">
                    <span class="label-text">Confirm password</span>
                    <div class="password-field">
                        <input type="password" name="confirm" class="password-input" placeholder="Repeat password" autocomplete="new-password">
                        <button type="button" class="toggle-password-btn" aria-label="Show/hide password">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </label>

                <button type="submit" class="btn primary">Create account</button>

                <div class="hr"><span>or</span></div>

                <p class="small muted">Already have an account? <a href="signin.html">Sign in</a></p>
            </form>

            <footer class="auth-foot">
                <a href="landing.html">← Back to Home</a>
            </footer>
        </section>
    </main>
    <script src="https://fhnoor.github.io/Angani-app/js/auth.js"></script>
</body>
</html>
